spring.application.name=livraison
server.port=8080

# --- DataSource MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/livraison_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Securite / JWT ---
app.jwt.secret=Q2hhbmdlTWVTZWNyZXRLZXlUcmVzTG9uZ0V0U3VyRXRFbmNvZGVCYXNlNjQxMjM0NTY3ODkw
app.jwt.expiration-ms=86400000
app.jwt.header=Authorization
app.jwt.prefix=Bearer 

# --- Compte admin par defaut (initialisation) ---
app.default-admin.username=admin
app.default-admin.password=admin123
app.default-admin.email=admin@livraison.local
