<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Gestion Livraison</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        body { background-color: #f5f7fa; }
        .navbar-brand { font-weight: 700; }
        .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .stat-icon { font-size: 2rem; opacity: .3; }
    </style>
</head>
<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="bi bi-truck"></i> Service Livraison
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'"
                       th:href="@{/dashboard}">Tableau de bord</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'commandes'} ? 'active'"
                       th:href="@{/commandes}">Commandes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'livraisons'} ? 'active'"
                       th:href="@{/livraisons}">Livraisons</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:classappend="${active == 'clients'} ? 'active'"
                       th:href="@{/clients}">Clients</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:classappend="${active == 'livreurs'} ? 'active'"
                       th:href="@{/livreurs}">Livreurs</a>
                </li>
            </ul>
            <span class="navbar-text text-light me-3" sec:authorize="isAuthenticated()">
                <i class="bi bi-person-circle"></i>
                <span sec:authentication="name">user</span>
            </span>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button class="btn btn-outline-light btn-sm" type="submit">
                    <i class="bi bi-box-arrow-right"></i> Deconnexion
                </button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="alerts">
    <div class="alert alert-success alert-dismissible fade show" role="alert"
         th:if="${successMessage}" th:text="${successMessage}">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert"
         th:if="${errorMessage}" th:text="${errorMessage}">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="footer" class="text-center text-muted py-4 mt-5 border-top">
    <small>Application de gestion d'un service de livraison &middot; Spring Boot 3.3.5</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
