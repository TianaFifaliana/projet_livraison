<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inscription')}"></head>
<body>
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4"><i class="bi bi-person-plus"></i> Creer un compte</h3>

                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="prenom">Prenom</label>
                                <input type="text" id="prenom" th:field="*{prenom}" class="form-control"
                                       th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{prenom}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="nom">Nom</label>
                                <input type="text" id="nom" th:field="*{nom}" class="form-control"
                                       th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{nom}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="telephone">Telephone</label>
                            <input type="text" id="telephone" th:field="*{telephone}" class="form-control"
                                   th:classappend="${#fields.hasErrors('telephone')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{telephone}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="username">Nom d'utilisateur</label>
                            <input type="text" id="username" th:field="*{username}" class="form-control"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{username}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Mot de passe</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="role">Role</label>
                            <select id="role" th:field="*{role}" class="form-select"
                                    th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{role}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
                    </form>
                    <hr/>
                    <p class="text-center mb-0">
                        Deja un compte ? <a th:href="@{/login}">Se connecter</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
