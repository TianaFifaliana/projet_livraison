<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body>
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="text-center mb-3"><i class="bi bi-truck"></i> Service Livraison</h3>
                    <h5 class="text-center text-muted mb-4">Connexion</h5>

                    <div class="alert alert-success" th:if="${param.registered}">Compte cree avec succes.</div>
                    <div class="alert alert-success" th:if="${param.logout}">Vous etes deconnecte.</div>
                    <div class="alert alert-danger" th:if="${param.error}">Nom d'utilisateur ou mot de passe invalide.</div>
                    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Nom d'utilisateur</label>
                            <input type="text" id="username" name="username" class="form-control" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Mot de passe</label>
                            <input type="password" id="password" name="password" class="form-control" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                    </form>

                    <hr/>
                    <p class="text-center mb-0">
                        Pas de compte ? <a th:href="@{/register}">Creer un compte</a>
                    </p>
                    <p class="text-center text-muted small mt-3 mb-0">
                        Demo admin : <strong>admin / admin123</strong>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
