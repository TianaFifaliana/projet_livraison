<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Livreurs')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(${active})}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Livreurs</h2>
        <a class="btn btn-primary" th:href="@{/livreurs/new}"><i class="bi bi-plus-lg"></i> Nouveau livreur</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th><th>Nom</th><th>Prenom</th><th>Email</th><th>Vehicule</th><th>Disponible</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="l : ${livreurs}">
                    <td th:text="${l.id}">1</td>
                    <td th:text="${l.nom}">nom</td>
                    <td th:text="${l.prenom}">prenom</td>
                    <td th:text="${l.email}">email</td>
                    <td th:text="${l.vehicule}">vehicule</td>
                    <td>
                        <span class="badge" th:classappend="${l.disponible} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${l.disponible} ? 'Oui' : 'Non'">Oui</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{'/livreurs/' + ${l.id} + '/edit'}">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form class="d-inline" th:action="@{'/livreurs/' + ${l.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Supprimer ce livreur ?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(livreurs)}">
                    <td colspan="7" class="text-center text-muted py-4">Aucun livreur enregistre</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
