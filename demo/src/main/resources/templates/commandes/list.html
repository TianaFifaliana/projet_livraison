<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Commandes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(${active})}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Commandes</h2>
        <a class="btn btn-primary" th:href="@{/commandes/new}"><i class="bi bi-plus-lg"></i> Nouvelle commande</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Reference</th><th>Client</th><th>Adresse</th><th>Statut</th>
                    <th class="text-end">Montant</th><th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${commandes}">
                    <td><a th:href="@{'/commandes/' + ${c.id}}" th:text="${c.reference}">ref</a></td>
                    <td th:text="${c.clientNom}">client</td>
                    <td th:text="${c.adresseLivraison != null} ? ${c.adresseLivraison.ville} : '-'">ville</td>
                    <td><span class="badge text-bg-secondary" th:text="${c.statut}">statut</span></td>
                    <td class="text-end" th:text="${c.montantTotal}">0</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{'/commandes/' + ${c.id} + '/edit'}">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form class="d-inline" th:action="@{'/commandes/' + ${c.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Supprimer cette commande ?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(commandes)}">
                    <td colspan="6" class="text-center text-muted py-4">Aucune commande enregistree</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
