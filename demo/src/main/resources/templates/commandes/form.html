<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editMode} ? 'Modifier commande' : 'Nouvelle commande')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(${active})}"></nav>
<div class="container">
    <h2 class="mb-3" th:text="${editMode} ? 'Modifier la commande' : 'Nouvelle commande'">Commande</h2>
    <div class="card">
        <div class="card-body">
            <form th:action="${editMode} ? @{'/commandes/' + ${commandeId}} : @{/commandes}"
                  th:object="${commandeRequest}" method="post">
                <h5 class="mb-3">Informations du client</h5>
                <div class="mb-3" th:if="${editMode}">
                    <label class="form-label">Client</label>
                    <input type="text" class="form-control" th:value="${clientNom}" readonly/>
                </div>
                <div th:if="${!editMode}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="clientPrenom">Prenom</label>
                            <input type="text" id="clientPrenom" th:field="*{clientPrenom}" class="form-control"
                                   th:classappend="${#fields.hasErrors('clientPrenom')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{clientPrenom}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="clientNom">Nom</label>
                            <input type="text" id="clientNom" th:field="*{clientNom}" class="form-control"
                                   th:classappend="${#fields.hasErrors('clientNom')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{clientNom}"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="clientTelephone">Telephone</label>
                            <input type="text" id="clientTelephone" th:field="*{clientTelephone}" class="form-control"
                                   th:classappend="${#fields.hasErrors('clientTelephone')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{clientTelephone}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="clientEmail">Email</label>
                            <input type="email" id="clientEmail" th:field="*{clientEmail}" class="form-control"
                                   th:classappend="${#fields.hasErrors('clientEmail')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{clientEmail}"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="clientAdresse">Adresse du client (optionnel)</label>
                        <input type="text" id="clientAdresse" th:field="*{clientAdresse}" class="form-control"/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="livreurId">Livreur (optionnel)</label>
                        <select id="livreurId" th:field="*{livreurId}" class="form-select">
                            <option value="">-- Aucun --</option>
                            <option th:each="lv : ${livreurs}" th:value="${lv.id}"
                                    th:text="${lv.prenom + ' ' + lv.nom}"></option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="adresseEnlevement">Adresse d'enlevement</label>
                        <input type="text" id="adresseEnlevement" th:field="*{adresseEnlevement}" class="form-control"
                               th:classappend="${#fields.hasErrors('adresseEnlevement')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{adresseEnlevement}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="adresseLivraison">Adresse de livraison</label>
                        <input type="text" id="adresseLivraison" th:field="*{adresseLivraison}" class="form-control"
                               th:classappend="${#fields.hasErrors('adresseLivraison')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{adresseLivraison}"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label" for="poids">Poids (kg)</label>
                        <input type="number" step="0.01" id="poids" th:field="*{poids}" class="form-control"/>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label" for="volume">Volume (m³)</label>
                        <input type="number" step="0.01" id="volume" th:field="*{volume}" class="form-control"/>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label" for="distance">Distance (km)</label>
                        <input type="number" step="0.01" id="distance" th:field="*{distance}" class="form-control"/>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label" for="prix">Prix</label>
                        <input type="number" step="0.01" id="prix" th:field="*{prix}" class="form-control"/>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="priorite">Priorite</label>
                        <select id="priorite" th:field="*{priorite}" class="form-select">
                            <option th:each="p : ${priorites}" th:value="${p}" th:text="${p}"></option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="statut">Statut</label>
                        <select id="statut" th:field="*{statut}" class="form-select">
                            <option th:each="s : ${statuts}" th:value="${s}" th:text="${s}"></option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="zoneId">Zone</label>
                        <input type="number" id="zoneId" th:field="*{zoneId}" class="form-control"/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="datePrevue">Date prevue</label>
                    <input type="datetime-local" id="datePrevue" th:field="*{datePrevue}" class="form-control"/>
                </div>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a class="btn btn-secondary" th:href="@{/commandes}">Annuler</a>
            </form>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
