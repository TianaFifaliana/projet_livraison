<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editMode} ? 'Modifier client' : 'Nouveau client')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(${active})}"></nav>
<div class="container">
    <h2 class="mb-3" th:text="${editMode} ? 'Modifier le client' : 'Nouveau client'">Client</h2>
    <div class="card">
        <div class="card-body">
            <form th:action="${editMode} ? @{'/clients/' + ${clientId}} : @{/clients}"
                  th:object="${clientRequest}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="prenom">Prenom</label>
                        <input type="text" id="prenom" th:field="*{prenom}" class="form-control"
                               th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{prenom}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="nom">Nom</label>
                        <input type="text" id="nom" th:field="*{nom}" class="form-control"
                               th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{nom}"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="telephone">Telephone</label>
                        <input type="text" id="telephone" th:field="*{telephone}" class="form-control"
                               th:classappend="${#fields.hasErrors('telephone')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{telephone}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="userId">Compte utilisateur (optionnel)</label>
                    <select id="userId" th:field="*{userId}" class="form-select">
                        <option value="">-- Aucun --</option>
                        <option th:each="u : ${users}" th:value="${u.id}"
                                th:text="${u.username + ' (' + u.email + ')'}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a class="btn btn-secondary" th:href="@{/clients}">Annuler</a>
            </form>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
